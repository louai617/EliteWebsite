# Shared proxy settings for the ELITE apps (included by sites-available/elite).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# Overwrite (never append to) the client's X-Forwarded-For: the apps rate-limit sign-ins by its
# first address, which must be the real visitor, not a value the visitor made up.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
